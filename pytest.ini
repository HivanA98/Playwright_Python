[pytest]
testpaths = tests
base_url = https://www.saucedemo.com
addopts =
    -v
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    ui: UI tests via browser
    api: HTTP/API-level tests (no browser)
    smoke: fast critical-path tests
