[pytest]
testpaths = tests
base_url = https://www.saucedemo.com
addopts =
    -v
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    ui: UI tests for a single page or feature
    e2e: multi-page user journeys through the shop
    api: HTTP/API-level tests (no browser)
    smoke: fast critical-path tests
    known_bug: documents a deliberate Saucedemo bug (xfail strict)
